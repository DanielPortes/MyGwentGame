name: WebGL Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - witcher3-gwent

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.0f1
  WEBGL_BUILD_PATH: Builds/WebGL

jobs:
  test-and-build:
    name: Test and build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_VERSION }}-WebGL-

      - name: Validate Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Set UNITY_LICENSE for a personal license or UNITY_SERIAL for a professional license before deploying Unity WebGL builds."
            exit 1
          fi

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:6000.3.0f1-base-3
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          GWENT_WEBGL_BUILD_PATH: ${{ env.WEBGL_BUILD_PATH }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          customImage: unityci/editor:6000.3.0f1-webgl-3
          targetPlatform: WebGL
          buildMethod: Gwent.Editor.GwentWebGlPagesBuilder.Build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WebGL artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.WEBGL_BUILD_PATH }}

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: test-and-build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
