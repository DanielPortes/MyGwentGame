name: WebGL Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - witcher3-gwent

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy WebGL to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Validate committed WebGL artifact
        run: |
          test -f docs/webgl/index.html
          test -f docs/webgl/.nojekyll
          test -f docs/webgl/Build/WebGL.loader.js
          test -f docs/webgl/Build/WebGL.wasm
          test -d docs/webgl/TemplateData
          grep -q 'WebGL.loader.js' docs/webgl/index.html
          grep -q 'WebGL.data' docs/webgl/index.html
          grep -q 'WebGL.framework.js' docs/webgl/index.html
          grep -q 'WebGL.wasm' docs/webgl/index.html
          ! grep -q 'webgl\.' docs/webgl/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WebGL artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/webgl

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
